name: Android debug APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}

      - name: Configure Android SDK / Java for Godot
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK"
          ls "$SDK/build-tools" | tail -3
          MAJOR_MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres
          cat ~/.config/godot/editor_settings-${MAJOR_MINOR}.tres

      - name: Import project
        run: |
          ~/godot/godot --headless --import --path . 2>&1 | tail -20

      - name: Export debug APK
        env:
          # Committed debug keystore: same signature for every build, so new
          # versions install over old ones. Debug-only, not for store releases.
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/nicole-pets-debug.apk 2>&1 | tee build/export.log
          test -s build/nicole-pets-debug.apk
          ls -la build
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner verify --print-certs build/nicole-pets-debug.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: nicole-pets-debug-apk
          path: build/nicole-pets-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-log
          path: build/export.log
          if-no-files-found: ignore
